<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Target Navigator</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="hud-panel">
  <div class="hud-title">
    <img src="icon.png" alt="Target Navigator Logo">
    <strong>Target Navigator</strong>
  </div>
  <small>Strategic Intelligence Overlay</small>
  
<div class="layer-toggles">
  <label><input type="checkbox" id="toggle-borders" checked onchange="toggleLayer('borders')"> Borders & Cities</label><br/>
  <label><input type="checkbox" id="toggle-military" checked onchange="toggleLayer('military')"> Strategic Bases</label><br/>
  <label><input type="checkbox" id="toggle-industrial" checked onchange="toggleLayer('industrial')"> Military-Industrial</label><br/>
  <label><input type="checkbox" id="toggle-petroleum" checked onchange="toggleLayer('petroleum')"> Petroleum-Industrial</label>
</div>

  <!-- GPS Coordinates Readout Field -->
<!-- GPS Coordinates Readout Field with Copy Button -->
<div class="coords-box">
  <label for="gps-coords">Coordinates & Date:</label>
  <div class="coords-input-wrapper">
    <input type="text" id="gps-coords" value="Select point on map..." readonly onclick="this.select()">
    <button id="copy-coords-btn" class="copy-btn" onclick="copyCoordinates()" title="Copy GPS Coordinates">📋</button>
  </div>
</div>
  
  <button class="reset-view-btn" onclick="resetMapView()">🎯 Reset Map Frame</button>
</div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Data & Application Logic -->
  <script src="landmarks.js"></script>
  <script type="module" src="app.js"></script>

  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => console.log('Service Worker registered successfully:', reg.scope))
        .catch((err) => console.error('Service Worker registration failed:', err));
    });
  }
</script>
</body>
</html>
